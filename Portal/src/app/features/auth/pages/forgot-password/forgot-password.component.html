<app-auth-shell>
  <!-- Reset email is a later slice. Until then this page does not pretend a link was sent. -->
  <div class="rounded-xl border border-paper-border bg-white px-5 py-6 shadow-[0_1px_3px_rgba(0,0,0,0.08)] sm:px-8 sm:py-8">
    <h2 class="text-2xl font-bold tracking-tight text-slate">Forgot password</h2>
    <p class="mt-2 text-sm leading-6 text-muted">
      A tenant admin sets the password on your staff account. Ask them to issue a new one.
    </p>
    <a
      routerLink="/login"
      class="mt-6 inline-flex h-12 w-full items-center justify-center rounded-[1.25rem] bg-linear-to-r from-primary to-primary-dark px-4 text-base font-bold text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    >
      Back to sign in
    </a>
  </div>
</app-auth-shell>
