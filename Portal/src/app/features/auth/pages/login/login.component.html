<div class="min-h-dvh bg-paper lg:grid lg:grid-cols-[42%_1fr]">
  <section
    class="brand-grain flex min-h-[42svh] flex-col justify-between bg-ink px-6 pb-8 pt-[max(1.5rem,env(safe-area-inset-top))] text-paper lg:min-h-dvh lg:px-10 lg:py-12"
  >
    <p class="text-sm font-semibold tracking-wide">ClaimBase</p>
    <div>
      <h1 class="max-w-md text-3xl font-bold leading-tight">Lecturer claims from the sessions they log.</h1>
      <p class="mt-3 text-sm text-paper/80">University staff only.</p>
    </div>
  </section>

  <main class="px-4 py-8 pb-[max(2rem,env(safe-area-inset-bottom))] lg:flex lg:items-center lg:px-16">
    <form class="mx-auto w-full max-w-md" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h2 class="text-2xl font-bold tracking-tight text-ink">Sign in</h2>
      <p class="mt-2 text-sm text-slate">Accounts are issued by a tenant admin.</p>

      <label class="mt-8 block text-sm font-semibold text-ink" for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.maxlength]="limits.email"
        class="mt-2 h-11 w-full rounded-md border border-paper-border bg-white px-3 text-base text-slate focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink"
      />

      <label class="mt-4 block text-sm font-semibold text-ink" for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.maxlength]="limits.passwordMax"
        class="mt-2 h-11 w-full rounded-md border border-paper-border bg-white px-3 text-base text-slate focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink"
      />

      @if (errorMessage()) {
        <p class="mt-4 text-sm text-ink" role="alert">{{ errorMessage() }}</p>
      }
      @if (lecturerBlocked()) {
        <p class="mt-4 text-sm font-semibold text-ink" role="alert">Use the ClaimBase mobile app</p>
      }

      <button
        type="submit"
        class="mt-6 inline-flex h-11 w-full items-center justify-center rounded-md bg-ink px-4 font-semibold text-paper focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink disabled:opacity-60"
        [disabled]="form.invalid || submitting()"
      >
        Sign in
      </button>
    </form>
  </main>
</div>
